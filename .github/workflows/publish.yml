name: Publish to CurseForge

# Runs when a GitHub release is published (a pre-release goes up as beta), or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version-type:
        description: CurseForge release type
        type: choice
        options: [release, beta, alpha]
        default: beta

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      # Version from gradle.properties, changelog from the newest section of CHANGELOG.md
      - name: Read version and changelog
        id: meta
        run: |
          echo "version=$(grep '^mod_version=' source/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            awk '/^## /{n++; next} n==1' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1710040
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: source/build/libs/fscreativelimiter-*.jar
          name: Creative Limiter ${{ steps.meta.outputs.version }} (1.21.1 NeoForge)
          version: 1.21.1-${{ steps.meta.outputs.version }}
          version-type: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'release') || inputs.version-type }}
          changelog: ${{ steps.meta.outputs.changelog }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: functional-storage(required)
