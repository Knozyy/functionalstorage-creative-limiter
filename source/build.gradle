plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.75'
}

group = 'com.knozyy'
version = "1.21.1-${mod_version}"

base {
    archivesName = 'fscreativelimiter'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    mods {
        fscreativelimiter {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    // Functional Storage 1.21.1-1.5.8 (CurseForge file 8459097).
    compileOnly 'curse.maven:functional-storage-556861:8459097'
    runtimeOnly 'curse.maven:functional-storage-556861:8459097'
    // Functional Storage depends on Titanium; its public classes reference it.
    compileOnly 'com.hrznstudio:titanium:1.21-4.0.34'
    runtimeOnly 'com.hrznstudio:titanium:1.21-4.0.34'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Implementation-Version': project.version
    }
}
